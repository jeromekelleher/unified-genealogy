tgp_base_url: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/release/20130502
sgdp_base_url: https://sharehost.hms.harvard.edu/genetics/reich_lab/sgdp/phased_data2021
recomb_map_base_url: https://bochet.gcc.biostat.washington.edu/beagle/genetic_maps
ancestral_allele_base_url: https://ftp.ensembl.org/pub/grch37/release-115/variation/vcf/homo_sapiens

chrom:
  - 20

worker_processes: 18

# Fields left out of the VCF Zarr encoding: large per-call fields that tsinfer
# does not read.
drop_fields:
  tgp: []
  sgdp: [call_GP, call_PL, call_AD, call_HS, call_DS]
  ancestral_alleles: []

# Region inferred by tsinfer, as a half-open interval of chromosome positions.
region:
  start: 10000000
  end: 11000000

tsinfer:
  threads: 4
  # bcftools-style filter applied to every source and the ancestral alleles.
  site_include: 'TYPE="snp"'
  max_gap_length: 500000
  samples_chunk_size: 100
  variants_chunk_size: 5000

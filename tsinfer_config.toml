[[source]]
name = "tgp"
path = "data/zarr_vcfs/tgp_chr20.vcz"
regions = "20:10000000-10100000"
include = 'TYPE="snp"'

[[source]]
name = "sgdp"
path = "data/zarr_vcfs/sgdp_chr20.vcz"
regions = "20:10000000-10100000"
include = 'TYPE="snp"'

[ancestral_state]
path = "data/zarr_vcfs/ancestral_alleles_chr20.vcz"
field = "variant_AA"

[[ancestors]]
name = "ancestors"
path = "data/zarr_vcfs/ancestors_chr20_10000000_10100000.vcz"
sources = ["tgp", "sgdp"]
max_gap_length = 500_000
samples_chunk_size = 100
variants_chunk_size = 5_000

[match]
output = "data/chr20_10000000_10100000.trees"

[match.sources.ancestors]
node_flags = 0
create_individuals = false

[match.sources.tgp]
node_flags = 1
create_individuals = true

[match.sources.sgdp]
node_flags = 1
create_individuals = true
